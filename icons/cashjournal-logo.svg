  <rect x="56" y="56" width="400" height="400" rx="118" fill="url(#tile)" stroke="#FFFFFF" stroke-opacity=".62" stroke-width="2" filter="url(#depth)"/>

  <g clip-path="url(#tileClip)">
    <rect x="56" y="56" width="400" height="400" fill="url(#blueGlow)"/>
    <rect x="56" y="56" width="400" height="400" fill="url(#greenGlow)"/>
    <rect x="56" y="56" width="400" height="400" fill="url(#orangeGlow)"/>
  </g>

  <path d="M256 183V365" fill="none" stroke="url(#spineGlow)" stroke-linecap="round" stroke-width="22" filter="url(#lightLeak)" clip-path="url(#bookClip)"/>

  <path d="M256 194C221 166 176 157 130 176V338C174 323 219 333 256 365V194Z" fill="url(#page)"/>
  <path d="M256 194C291 166 336 157 382 176V338C338 323 293 333 256 365V194Z" fill="url(#page)" fill-opacity=".92"/>

  <path d="M256 194V365" fill="none" stroke="url(#spineGlow)" stroke-linecap="round" stroke-opacity=".68" stroke-width="5"/>
