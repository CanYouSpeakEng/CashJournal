      <stop offset=".43" stop-color="#F5C18F" stop-opacity=".4"/>
      <stop offset="1" stop-color="#F8DCC0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spineGlow" x1="256" y1="180" x2="256" y2="363" gradientUnits="userSpaceOnUse">
