<svg aria-label="CashJournal monogram logo" role="img" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tile" x1="76" y1="64" x2="432" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F8F9"/>
      <stop offset="1" stop-color="#E4EBED"/>
    </linearGradient>
    <linearGradient id="page" x1="133" y1="170" x2="372" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#294559"/>
      <stop offset="1" stop-color="#183243"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(256 178) rotate(90) scale(138 190)">
      <stop stop-color="#75D6F2" stop-opacity=".8"/>
      <stop offset=".42" stop-color="#9BE2F3" stop-opacity=".38"/>
      <stop offset="1" stop-color="#BCECF4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientTransform="translate(328 273) rotate(145) scale(128 154)">
      <stop stop-color="#68D1AC" stop-opacity=".82"/>
      <stop offset=".45" stop-color="#92DEC5" stop-opacity=".38"/>
      <stop offset="1" stop-color="#BDEADA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orangeGlow" cx="0" cy="0" r="1" gradientTransform="translate(194 289) rotate(35) scale(126 152)">
