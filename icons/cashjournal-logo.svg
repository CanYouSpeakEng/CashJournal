    <clipPath id="bookClip">
      <path d="M256 194C221 166 176 157 130 176V338C174 323 219 333 256 365V194Z"/>
      <path d="M256 194C291 166 336 157 382 176V338C338 323 293 333 256 365V194Z"/>
